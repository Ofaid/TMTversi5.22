name: TeamTalk5 Android Build (Standalone arm64-v8a)

on:
  workflow_dispatch:
  push:
    branches: [ modifikasi-jar-kelas ] # Otomatis jalan pas push ke branch modifikasi

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      
      # ✅ LANGKAH KRUSIAL: UPLOAD LIBRARY JAR & SO KE REPO SEBELUM BUILD
      # Pastikan file-file ini ada di repo:
      # libs/TeamTalk5.jar
      # libs/TeamTalk5Test.jar  
      # app/src/main/jniLibs/arm64-v8a/libTeamTalk5-jni.so
      
      - name: Generate Release Keystore
        run: |
          keytool -genkeypair -v -keystore release-key.keystore \
            -alias teamtalk-release -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android123 -keypass android123 \
            -dname "CN=TeamTalk, OU=Dev, O=TeamTalk, L=Jakarta, ST=DKI, C=ID"
          cat > keystore.properties <<EOF
          storeFile=release-key.keystore
          storePassword=android123
          keyAlias=teamtalk-release
          keyPassword=android123
          EOF
      
      - name: Build Release APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
      
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TeamTalk5-arm64-v8a-Standalone
          path: build/outputs/apk/release/*.apk
          if-no-files-found: error
