plugins {
    alias(libs.plugins.android.application)
}

def ksFile = rootProject.file('keystore.properties')
def ks = new Properties()
if (ksFile.exists()) {
    ksFile.withInputStream { ks.load(it) }
}

android {
    // ✅ GANTI NAMESPACE BIAR GAK BENTROK SAMA PROJECT LAIN
    namespace = 'dk.bearware.gui.standalone' 
    compileSdk = 37 
    buildToolsVersion = '37.0.0'
    // ndkVersion dihapus karena kita handle JNI libs manual
    
    defaultConfig {
        applicationId = 'dk.bearware.gui'
        minSdk = 23
        targetSdk = 37
        versionCode = 150
        versionName = '5.22'
        testInstrumentationRunner = 'androidx.test.runner.AndroidJUnitRunner'
    }

    signingConfigs {
        release {
            if (ksFile.exists()) {
                storeFile = rootProject.file(ks['storeFile'])
                storePassword = ks['storePassword']
                keyAlias = ks['keyAlias']
                keyPassword = ks['keyPassword']
                
                enableV1Signing = true
                enableV2Signing = true
                enableV3Signing = true
                enableV4Signing = false
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled = false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (ksFile.exists()) {
                signingConfig = signingConfigs.release
            }
        }
        debug {
            if (ks['signDebug']?.toBoolean()) {
                signingConfig = signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
        coreLibraryDesugaringEnabled = true
    }

    buildFeatures {
        buildConfig = true
        viewBinding = true
    }

    androidResources {
        generateLocaleConfig = true
    }

    splits {
        abi {
            enable = true
            reset()
            include 'arm64-v8a'
            universalApk = false
        }
    }

    // ✅ HAPUS sourceSets jniLibs-staging. Pakai folder standar aja.
    // Kalau mau pakai folder custom, uncomment baris bawah & taruh .so di sana
    // sourceSets {
    //     main {
    //         jniLibs.srcDirs = ['src/main/jniLibs']
    //     }
    // }

    packaging {
        jniLibs {
            // ⚠️ HAPUS EXCLUDE INI KALAU KAMU MAU PAKAI LIB PRO
            // excludes += ['**/libTeamTalk5Pro-jni.so']
        }
        pickFirsts = [
                'META-INF/LICENSE.md',
                'META-INF/LICENSE-notice.md'
        ]
    }

    lint {
        disable 'MissingTranslation'
    }
}

// ✅ HAPUS TASK syncJniLibs YANG NYEDOT DARI MODUL LUAR
// tasks.register('syncJniLibs', Sync) { ... } DIHAPUS TOTAL

// ✅ HAPUS afterEvaluate DEPENDS_ON syncJniLibs
// afterEvaluate { ... } DIHAPUS TOTAL

dependencies {
    coreLibraryDesugaring libs.desugar.jdk.libs
    implementation libs.gson
    implementation libs.androidx.annotation
    implementation libs.androidx.appcompat
    implementation libs.androidx.core
    implementation libs.androidx.fragment
    implementation libs.androidx.media
    implementation libs.androidx.preference
    implementation libs.androidx.viewpager
    implementation libs.material
    
    // ✅ GANTI PATH JAR KE FOLDER LOCAL 'libs/'
    implementation files('libs/TeamTalk5.jar')

    testImplementation libs.junit.jupiter.api
    testImplementation files('libs/TeamTalk5Test.jar')

    androidTestImplementation libs.androidx.test.core
    androidTestImplementation libs.androidx.test.runner
    androidTestImplementation libs.androidx.test.rules
    androidTestImplementation libs.junit.jupiter.api
    androidTestImplementation files('libs/TeamTalk5Test.jar')
}
